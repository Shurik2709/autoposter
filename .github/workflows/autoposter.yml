name: Social Autoposter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск постера
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python poster.py

      - name: Коммит RSS-файла (для Яндекс Дзен)
        run: |
          git config user.name "autoposter-bot"
          git config user.email "bot@noreply.github.com"
          if git diff --quiet zen_feed.xml 2>/dev/null; then
            echo "RSS не изменился"
          else
            git add zen_feed.xml
            git commit -m "update zen RSS feed"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
